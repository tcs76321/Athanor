# Athanor example configuration.
#
# This mirrors the complete reference config in ARCHITECTURE.md §29. Every
# value below equals the built-in default, so copying this file to
# config.yaml changes nothing — edit only what you need and delete the rest;
# omitted fields fall back to the same defaults.
#
# Notes:
# - Durations must be quoted strings ("5m", "120s", "1h30m").
# - Unknown keys are rejected (strict parsing).
# - If config.yaml is absent, the daemon boots on these defaults and logs a
#   notice; a present-but-invalid config still fails loudly.

version: 2

agent:
  active_hours: "00:00-24:00"
  idle_threshold: "5m"
  max_proactive_tasks_per_day: 10

power:
  require_ac_for_deep_work: true
  battery_pause_threshold_percent: 20
  idle_resume_after: "5m"
  allow_battery_override: false
  pause_on_sleep: true
  resume_on_wake: true
  daydream_on_idle: true
  daydream_max_concurrent: 2
  daydream_max_wall_time_minutes: 30

inference:
  default_backend: ollama
  ollama_url: "http://host.containers.internal:11434"
  cloud_enabled: false
  cloud_requires_approval: true

# Models assigned to functional roles (§12). security must stay at
# temperature 0.0 — evaluation and compaction are deterministic.
personas:
  wide:
    model: "qwen2.5:7b"
    context_target: 65536
    temperature: 0.7
  tall:
    model: "qwen2.5-coder:32b"
    context_target: 16384
    temperature: 0.2
  main:
    model: "mistral-nemo:12b"
    context_target: 32768
    temperature: 0.4
  security:
    model: "phi3:3.8b"
    context_target: 8192
    temperature: 0.0
  alternative:
    model: "llama3.1:8b"
    context_target: 32768
    temperature: 0.8

context_engine:
  # Floors are role-scoped working-set requirements, not per-task
  # constants (§12.6, ADR-0002).
  coding_floor: 32768
  research_floor: 32768
  document_floor: 16384
  simple_floor: 8192
  compaction_temperature: 0.0   # invariant: always 0.0 (§10.3)
  enable_lossless_swapping: true
  kv_cache_warning_threshold: 0.85
  kv_cache_critical_threshold: 0.95
  # M5-T2 division bounds (§10.1): a source larger than max_source_bytes is
  # skipped with a `context` audit row; an oversized chunk is byte-split.
  division_max_source_bytes: 1048576
  division_max_chunk_bytes: 131072
  division_fallback_lines: 120
  # M5-T7 memory retrieval (§10.2, §25; ADR-0026 §7). memory_embedding_model
  # is an Ollama embedding model name; leave it empty to keep the vector half
  # inert, in which case query_memory searches full-text only. The vector half
  # also requires embeddings to exist in memory_embeddings (produced by the
  # repository indexing pipeline, M5-T8). memory_search_top_k caps the hits a
  # single query returns.
  memory_embedding_model: ""
  memory_search_top_k: 8
  # M5-T8 repository indexing (ADR-0028 §8). index_batch_files caps the
  # files one pass processes; index_batch_chunks caps summary + embedding
  # model calls per pass; index_embed_bytes is the content prefix in an
  # embedding digest (0 = path + summary only); index_ignore_dirs are extra
  # directory names skipped in addition to the built-in VCS/dependency/build
  # set. Indexing runs through `athanor index`, the POST
  # /projects/{id}/index route, and the idle Repository Exploration action.
  index_batch_files: 50
  index_batch_chunks: 200
  index_embed_bytes: 2048
  index_ignore_dirs: []

execution:
  divergence_candidates: 3
  max_hard_task_variations: 10
  max_reflection_loops: 2
  judge_persona: security
  # The three flags below are M3-deferred: declared and
  # defaulted to true, but the engine does not yet consult
  # them. Operators who set any of these to false today will
  # see no behavior change. They become effective in M6/M7.
  require_tests_for_code: true
  require_documentation_for_code: true
  compare_before_accept: true
  min_judge_confidence: 0.7
  # Wall-time budgets per Dialectical phase (§13); "default" covers phases
  # without a specific entry.
  phase_wall_time_budgets:
    planning: "300s"
    evaluating: "600s"        # must accommodate Job Pod boot + test suite
    default: "300s"

strategy_analysis:
  enabled: true
  min_cohort_size: 20
  min_accept_rate_delta: 0.15
  auto_promote: false            # promote conservative insights without HITL
  max_active_insights: 10
  insight_expiry_days: 90
  strategy_notes_in_prompts: true

limits:
  max_concurrent_jobs: 2
  max_concurrent_llm_calls: 1
  max_concurrent_fetches: 5
  max_tasks_per_hour: 20
  max_total_recoveries_per_job: 8

recovery:
  max_tool_call_retries: 2
  max_loop_interventions: 1
  max_context_compactions: 3

network:
  default_policy: deny           # default-deny; allow_list opens exceptions
  allow_list: []
  rate_limit_per_minute: 30
  max_response_bytes: 10485760
  reader_mode_default: true
    # §21.5 Reader Mode extraction (M4-T6, ADR-0018). When true,
    # fetched HTML responses pass through readability → sanitize →
    # markdown → prompt-injection scan; text/plain passes through
    # verbatim (still scanned). When false, extraction is refused
    # with ErrReaderDisabled and callers receive the raw fetched
    # bytes. The default is true; an operator who disables it
    # explicitly opts into raw-HTML handling.
  browser_mode_requires_approval: true
    # M4-T5 deferred, M6 follow-up (ADR-0017 §10):
    # the §21.6 Browser Mode runtime is part of
    # the M6 HITL infrastructure. The flag is
    # declared + defaulted to true so operators
    # do not silently think it is in effect. The
    # deferral mirrors the dormant-Execution-flags
    # pattern from f309500.
  search_engine_url_template: ""
    # M4-T7 `search_web` backend (ADR-0019 §4). A
    # text/template URL with one {{.Query}} action,
    # e.g. "https://html.duckduckgo.com/html/?q={{.Query}}".
    # Empty (the default) leaves `search_web` inert:
    # calls return ErrSearchNotConfigured. The built
    # URL is NOT exempt from the allowlist — the
    # engine's host must be in allow_list. Validated
    # at load: must parse, must reference {{.Query}},
    # and must render to an http(s) URL.
  # External API Host-header allowlist (ADR-0011,
  # §21.8 hardening). Requests whose Host header is
  # not in this set are rejected with 421 Misdirected
  # Request. The default is the canonical loopback
  # set; operators behind a reverse proxy add their
  # proxy's Host here. The internal API at
  # /internal/v1/ is unaffected (it has its own
  # bearer-token auth).
  external_api_host_allowlist:
    - "127.0.0.1:7420"
    - "localhost:7420"
    - "[::1]:7420"
    - "athanor.local:7420"

security:
  scan_ingress_files: true
  scan_egress_files: true
  prompt_injection_scan: true
  quarantine_suspicious_files: true

backup:
  auto: true
  schedule: "0 3 * * *"
  max_local_backups: 10
  include_workspace_metadata: true

logging:
  level: info
  categories:
    - jobs
    - recovery
    - alarms
    - airlock
    - network
    - podman
    - inference
    - feedback
    - strategy
    - context
    - daydream
    - power
    - backup

job_pod:
  # Per-job tool envelope applied to every job that does not
  # declare its own allowed_tools_json override. The §25 closed
  # set is execute_code, run_tests, lint, git_operation,
  # fetch_url, search_web, context_swap, query_memory — though
  # git_operation has no route yet (M6). Empty list = "no
  # tools", which is the safe default: the engine still runs
  # the LLM-only phases but no code, tests, network, or memory
  # tool runs until the operator opts in.
  default_tools: []
  # Image is the Job Pod base image. The default is intentionally
  # empty: the daemon still boots (LLM-only jobs work) but logs a
  # warning at boot and refuses to dispatch any Job Pod tool call
  # (503) until an operator sets it, so a daemon cannot silently
  # select the wrong base image (ADR-0024 §6).
  image: ""
  # Resource limits override the §21.2 defaults. Zero values
  # mean "use jobpod's defaults" (pids=64, memory=512m, cpus=1.0).
  pids_limit: 0
  memory_mb: 0
  cpus: 0

airlock:
  # §21.3 file-airlock pipeline (M4-T2/T3/T4; ADR-0015). The
  # per-pipeline scanner lists are the three choke points in
  # ADR-0015 §"Trust boundaries, not all text". Egress
  # intentionally omits prompt-injection scanners: egress data
  # was generated by the LLM, scanning it for injection is a
  # category error. A scanner name the registry cannot
  # instantiate (e.g. "clamav" without clamdscan on PATH)
  # degrades to VerdictUncertain at scan time; the pipeline
  # fails closed.
  enabled: true
  scanners:
    ingress:
      - prompt-injection-heuristic
      - size
      - zipbomb
      - clamav
      - yara
    egress:
      - size
      - zipbomb
      - clamav
      - yara
    user_prompt:
      - prompt-injection-heuristic
  # §21.3 numeric thresholds applied by the in-tree `size` and
  # `zipbomb` scanners. The 100 MiB / 100x / 10k numbers are
  # the ROADMAP M4-T4 acceptance criteria.
  max_ingress_bytes: 104857600
  max_uncompressed_ratio: 100
  max_zip_entries: 10000
  # Long-user-prompt heuristic (§21.4 layer; ADR-0015).
  # Prompts over the threshold pass through the
  # `prompt-injection-heuristic` scanner at goal-submit time.
  # The threshold is a heuristic, not a security boundary;
  # operators who paste long, benign material can disable the
  # check.
  prompt_injection_long_user_prompt_threshold_bytes: 2048
  prompt_injection_scan_long_user_prompts: true
  # Path to a private YARA rule set. Leave empty (the
  # default) to use the in-tree baseline ruleset
  # (embedded in the daemon binary, materialized to
  # <state-dir>/yara/injection.yar on boot). Set to an
  # absolute path to use a hardened private rule set
  # instead. An empty string + an absent `yara` binary
  # = VerdictUncertain (fail-closed).
  yara_rule_set: ""
