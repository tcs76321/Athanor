  - id: code-retry-backoff
    title: Retry with exponential backoff
    archetype: code
    tier: H
    language: python
    goal: |
      Implement retry(fn, attempts, base, sleep) in solution.py: call fn until it succeeds, sleeping base, 2*base, 4*base ... between attempts via the injected sleep(seconds); return the result; after attempts failures re-raise the last error.
    criteria:
      - "pure stdlib"
      - "sleep is injected (deterministic)"
      - "re-raises the last error"
    test_command: |
      python -c 'import solution
      calls = []
      sleeps = []
      def sleep(s):
          sleeps.append(s)
      def fn():
          calls.append(1)
          if len(calls) < 3:
              raise ValueError("x")
          return "ok"
      assert solution.retry(fn, 3, 1, sleep) == "ok"
      assert sleeps == [1, 2]
      calls.clear()
      sleeps.clear()
      def bad():
          calls.append(1)
          raise ValueError("no")
      try:
          solution.retry(bad, 2, 1, sleep)
          assert False, "failure not raised"
      except ValueError:
          pass
      assert len(calls) == 2 and sleeps == [1]'
    acceptance_floor: "test_command exits 0"
    quality_rubric:
      - "5: correct backoff and error"
      - "3: correct but sleeps after the last attempt"
      - "1: swallows the error"
    context_size: small
    context_demand: short
    expected_failure_modes:
      - "sleeps after the final attempt"
      - "returns None on exhaustion"

