    def balanced(s):
        pairs = {")": "(", "]": "[", "}": "{"}
        stack = []
        for c in s:
            if c in "([{":
                stack.append(c)
            elif c in pairs:
                if not stack or stack.pop() != pairs[c]:
                    return False
        return not stack

  code-topo-sort: |
    from collections import deque


    def topo_sort(graph):
        nodes = set(graph)
        for deps in graph.values():
            nodes.update(deps)
        indegree = {n: 0 for n in nodes}
        adj = {n: [] for n in nodes}
        for node, deps in graph.items():
            for dep in deps:
                adj[dep].append(node)
                indegree[node] += 1
        queue = deque(n for n in nodes if indegree[n] == 0)
        out = []
        while queue:
            node = queue.popleft()
            out.append(node)
            for nxt in adj[node]:
                indegree[nxt] -= 1
                if indegree[nxt] == 0:
                    queue.append(nxt)
        if len(out) != len(nodes):
            raise ValueError("cycle")
        return out

  code-csv-rfc4180: |
    def parse_csv(text):
        rows = []
        row = []
        field = []
        in_quotes = False
        i = 0
        while i < len(text):
            c = text[i]
            if in_quotes:
                if c == '"':
                    if i + 1 < len(text) and text[i + 1] == '"':
                        field.append('"')
                        i += 2
                        continue
                    in_quotes = False
                    i += 1
                    continue
                field.append(c)
                i += 1
                continue
            if c == '"':
                in_quotes = True
            elif c == ",":
                row.append("".join(field))
                field = []
            elif c == "\n":
                row.append("".join(field))
                rows.append(row)
                row = []
                field = []
            elif c != "\r":
                field.append(c)
            i += 1
        if field or row:
            row.append("".join(field))
            rows.append(row)
        return rows

  code-rotated-search: |
    def search_rotated(xs, target):
        lo, hi = 0, len(xs) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if xs[mid] == target:
                return mid
            if xs[lo] == xs[mid] == xs[hi]:
                lo += 1
                hi -= 1
            elif xs[lo] <= xs[mid]:
                if xs[lo] <= target < xs[mid]:
                    hi = mid - 1
                else:
                    lo = mid + 1
            else:
                if xs[mid] < target <= xs[hi]:
                    lo = mid + 1
                else:
                    hi = mid - 1
        return -1

