# Athanor benchmark v1 — reference solutions for the code tasks.
#
# These are NOT part of the frozen task set and are never shown to a model.
# `corpus_v1_test.go` writes each one to a temp dir (`solution.py`, or
# `messy.py` for the refactor task) and runs the task's real `test_command`
# against it. That proves the deterministic check is satisfiable and pins the
# expected behavior; a task whose reference fails is a broken task.
#
# They are deliberately plain: the benchmark measures the engine, not the
# reference. Where a task permits an oracle (unified diff), the reference uses
# it and the test still pins exact output.
version: 1
