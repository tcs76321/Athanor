  code-bank-atomic: |
    class Ledger:
        def __init__(self):
            self.entries = []


    class Account:
        def __init__(self, ledger=None):
            self._balance = 0
            self.ledger = ledger

        @property
        def balance(self):
            return self._balance

        def _record(self, kind, amount):
            if self.ledger is not None:
                self.ledger.entries.append((kind, amount))

        def deposit(self, n):
            if n < 0:
                raise ValueError("negative deposit")
            self._balance += n
            self._record("deposit", n)

        def withdraw(self, n):
            if n < 0 or n > self._balance:
                raise ValueError("insufficient funds")
            self._balance -= n
            self._record("withdraw", n)

        def transfer(self, other, n):
            if n < 0 or n > self._balance:
                raise ValueError("insufficient funds")
            self._balance -= n
            other._balance += n
            self._record("transfer", n)

  code-expr-eval: |
    class _Parser:
        def __init__(self, text):
            self.text = text
            self.i = 0

        def peek(self):
            while self.i < len(self.text) and self.text[self.i].isspace():
                self.i += 1
            return self.text[self.i] if self.i < len(self.text) else ""

        def expr(self):
            value = self.term()
            while self.peek() in ("+", "-"):
                op = self.text[self.i]
                self.i += 1
                rhs = self.term()
                value = value + rhs if op == "+" else value - rhs
            return value

        def term(self):
            value = self.factor()
            while self.peek() in ("*", "/"):
                op = self.text[self.i]
                self.i += 1
                rhs = self.factor()
                if op == "*":
                    value *= rhs
                else:
                    if rhs == 0:
                        raise ZeroDivisionError("division by zero")
                    value //= rhs
            return value

        def factor(self):
            c = self.peek()
            if c == "-":
                self.i += 1
                return -self.factor()
            if c == "(":
                self.i += 1
                value = self.expr()
                if self.peek() != ")":
                    raise ValueError("expected )")
                self.i += 1
                return value
            if c.isdigit():
                start = self.i
                while self.i < len(self.text) and self.text[self.i].isdigit():
                    self.i += 1
                return int(self.text[start:self.i])
            raise ValueError("unexpected input")


    def evaluate(expr):
        parser = _Parser(expr)
        value = parser.expr()
        if parser.peek() != "":
            raise ValueError("trailing input")
        return value

  code-lru-ttl: |
    import time
    from collections import OrderedDict


    class LRUCache:
        def __init__(self, capacity, ttl_seconds):
            self.capacity = capacity
            self.ttl = ttl_seconds
            self.data = OrderedDict()

        def get(self, key):
            if key not in self.data:
                return None
            expires, value = self.data[key]
            if time.monotonic() >= expires:
                del self.data[key]
                return None
            self.data.move_to_end(key)
            return value

        def put(self, key, value):
            if key in self.data:
                del self.data[key]
            self.data[key] = (time.monotonic() + self.ttl, value)
            while len(self.data) > self.capacity:
                self.data.popitem(last=False)

