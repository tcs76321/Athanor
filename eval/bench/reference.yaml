  code-parse-duration: |
    import re


    class DurationError(ValueError):
        pass


    _UNITS = {"s": 1, "m": 60, "h": 3600, "d": 86400}


    def parse_duration(s):
        if not isinstance(s, str) or not s.strip():
            raise DurationError("empty duration")
        pos = 0
        total = 0
        for match in re.finditer(r"\s*(\d+)\s*([smhd])", s):
            if match.start() != pos:
                raise DurationError("bad token at %d" % pos)
            total += int(match.group(1)) * _UNITS[match.group(2)]
            pos = match.end()
        if pos != len(s):
            raise DurationError("bad token at %d" % pos)
        return total

