    def merge(intervals):
        if not intervals:
            return []
        iv = sorted(intervals)
        out = [list(iv[0])]
        for start, end in iv[1:]:
            if start <= out[-1][1]:
                out[-1][1] = max(out[-1][1], end)
            else:
                out.append([start, end])
        return out

  code-rle: |
    def encode(s):
        if not s:
            return ""
        out = []
        run, count = s[0], 1
        for c in s[1:]:
            if c == run:
                count += 1
            else:
                out.append(run + str(count))
                run, count = c, 1
        out.append(run + str(count))
        return "".join(out)


    def decode(s):
        out = []
        i = 0
        while i < len(s):
            char = s[i]
            i += 1
            start = i
            while i < len(s) and s[i].isdigit():
                i += 1
            if start == i:
                raise ValueError("missing count")
            out.append(char * int(s[start:i]))
        return "".join(out)

  code-roman: |
    _VALUES = [
        (1000, "M"), (900, "CM"), (500, "D"), (400, "CD"),
        (100, "C"), (90, "XC"), (50, "L"), (40, "XL"),
        (10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I"),
    ]


    def to_roman(n):
        if not 0 < n < 4000:
            raise ValueError("out of range")
        out = []
        for value, symbol in _VALUES:
            while n >= value:
                out.append(symbol)
                n -= value
        return "".join(out)


    def from_roman(s):
        values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
        total = 0
        prev = 0
        for c in reversed(s):
            value = values[c]
            if value < prev:
                total -= value
            else:
                total += value
                prev = value
        return total

  code-semver: |
    import re


    _SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")


    def parse(v):
        match = _SEMVER.match(v)
        if not match:
            raise ValueError("bad semver: %r" % v)
        return tuple(int(x) for x in match.groups())


    def compare(a, b):
        pa, pb = parse(a), parse(b)
        return (pa > pb) - (pa < pb)

  code-glob: |
    from functools import lru_cache


    def match(pattern, s):
        @lru_cache(maxsize=None)
        def go(i, j):
            if i == len(pattern):
                return j == len(s)
            c = pattern[i]
            if c == "*":
                return go(i + 1, j) or (j < len(s) and go(i, j + 1))
            if j < len(s) and (c == "?" or c == s[j]):
                return go(i + 1, j + 1)
            return False

        return go(0, 0)

  code-json-pointer: |
    def resolve(doc, pointer):
        if pointer == "":
            return doc
        if not pointer.startswith("/"):
            raise ValueError("bad pointer")
        cur = doc
        for raw in pointer[1:].split("/"):
            token = raw.replace("~1", "/").replace("~0", "~")
            if isinstance(cur, list):
                cur = cur[int(token)]
            elif isinstance(cur, dict):
                cur = cur[token]
            else:
                raise KeyError(token)
        return cur

  code-token-bucket: |
    class TokenBucket:
        def __init__(self, rate, capacity, clock):
            self.rate = float(rate)
            self.capacity = float(capacity)
            self.clock = clock
            self.tokens = float(capacity)
            self.last = clock()

        def allow(self, n=1):
            now = self.clock()
            self.tokens = min(self.capacity, self.tokens + (now - self.last) * self.rate)
            self.last = now
            if self.tokens >= n:
                self.tokens -= n
                return True
            return False

  code-union-find: |
    class UnionFind:
        def __init__(self, n):
            self.parent = list(range(n))
            self.rank = [0] * n
            self.count = n

        def find(self, x):
            while self.parent[x] != x:
                self.parent[x] = self.parent[self.parent[x]]
                x = self.parent[x]
            return x

        def union(self, a, b):
            ra, rb = self.find(a), self.find(b)
            if ra == rb:
                return
            if self.rank[ra] < self.rank[rb]:
                ra, rb = rb, ra
            self.parent[rb] = ra
            if self.rank[ra] == self.rank[rb]:
                self.rank[ra] += 1
            self.count -= 1

        def connected(self, a, b):
            return self.find(a) == self.find(b)

        def components(self):
            return self.count

