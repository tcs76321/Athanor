  code-retry-backoff: |
    def retry(fn, attempts, base, sleep):
        last = None
        for i in range(attempts):
            try:
                return fn()
            except Exception as exc:  # noqa: BLE001 - the task retries any failure
                last = exc
                if i < attempts - 1:
                    sleep(base * (2 ** i))
        raise last

  code-priority-queue: |
    import heapq
    import itertools


    class PriorityQueue:
        def __init__(self):
            self._heap = []
            self._counter = itertools.count()

        def push(self, item, priority):
            heapq.heappush(self._heap, (-priority, next(self._counter), item))

        def pop(self):
            if not self._heap:
                raise IndexError("pop from an empty priority queue")
            return heapq.heappop(self._heap)[2]

  code-json-patch: |
    import copy


    def _parts(path):
        if not path.startswith("/"):
            raise ValueError("bad path")
        return [p.replace("~1", "/").replace("~0", "~") for p in path[1:].split("/")]


    def _get(doc, parts):
        cur = doc
        for part in parts:
            if isinstance(cur, list):
                cur = cur[int(part)]
            else:
                cur = cur[part]
        return cur


    def apply_patch(doc, patch):
        out = copy.deepcopy(doc)
        for op in patch:
            parts = _parts(op["path"])
            kind = op["op"]
            if kind == "test":
                if _get(out, parts) != op["value"]:
                    raise ValueError("test failed")
            elif kind in ("replace", "add", "remove"):
                parent = _get(out, parts[:-1])
                key = parts[-1]
                if kind == "replace":
                    if isinstance(parent, list):
                        parent[int(key)] = op["value"]
                    else:
                        parent[key] = op["value"]
                elif kind == "add":
                    if isinstance(parent, list):
                        parent.insert(int(key), op["value"])
                    else:
                        parent[key] = op["value"]
                else:
                    if isinstance(parent, list):
                        parent.pop(int(key))
                    else:
                        del parent[key]
            else:
                raise ValueError("unsupported op")
        return out

  code-weighted-intervals: |
    import bisect


    def max_weight(intervals):
        if not intervals:
            return 0
        iv = sorted(intervals, key=lambda x: x[1])
        ends = [x[1] for x in iv]
        best = [0] * (len(iv) + 1)
        for i in range(1, len(iv) + 1):
            start, _end, weight = iv[i - 1]
            j = bisect.bisect_right(ends, start, 0, i - 1)
            best[i] = max(best[i - 1], best[j] + weight)
        return best[-1]
