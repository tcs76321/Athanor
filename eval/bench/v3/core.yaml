  - id: core-code-topo-sort
    title: Topological sort with cycle detection
    suite: core
    archetype: code
    tier: H
    language: python
    held_out: false
    goal: |
      Implement topo_sort(graph) in solution.py where graph maps a node to its
      dependency list. Return a list containing every node with each dependency
      before its dependents; raise ValueError when the graph has a cycle.
    criteria:
      - pure stdlib
      - every node appears once
      - cycle raises ValueError
    test_command: |
      python -c 'import solution
      g = {"a": [], "b": ["a"], "c": ["b"]}
      o = solution.topo_sort(g)
      assert set(o) == set(g)
      assert o.index("a") < o.index("b") < o.index("c")
      try:
          solution.topo_sort({"a": ["b"], "b": ["a"]})
          assert False, "cycle not detected"
      except ValueError:
          pass'
    acceptance_floor: test_command exits 0
    quality_rubric:
      - '5: correct Kahn/DFS with cycle detection'
      - '3: correct order but no cycle detection'
      - '1: drops nodes'
    expected_failure_modes:
      - returns a partial order
      - loops forever on a cycle
      - loses a node with no outgoing edges

  - id: core-code-json-patch
    title: Apply a JSON Patch subset
    suite: core
    archetype: code
    tier: H
    language: python
    held_out: false
    goal: |
      Implement apply_patch(doc, patch) in solution.py for RFC 6902 ops add,
      replace, remove, and test on object paths ("/a", "/b/c"); return a new
      document, leave the input unchanged, and raise ValueError when a test op
      fails or a path is missing.
    criteria:
      - pure stdlib
      - does not mutate the input
      - test failure raises ValueError
    test_command: |
      python -c 'import solution
      doc = {"a": 1, "b": {"c": 2}}
      out = solution.apply_patch(doc, [{"op": "replace", "path": "/a", "value": 3}, {"op": "add", "path": "/b/d", "value": 4}])
      assert out == {"a": 3, "b": {"c": 2, "d": 4}}
      assert doc == {"a": 1, "b": {"c": 2}}
      try:
          solution.apply_patch(doc, [{"op": "test", "path": "/a", "value": 9}])
          assert False, "failed test op accepted"
      except ValueError:
          pass'
    acceptance_floor: test_command exits 0
    quality_rubric:
      - '5: correct, non-mutating, test op'
      - '3: correct ops but mutates the input'
      - '1: ignores the test op'
    expected_failure_modes:
      - mutates the input document
      - ignores the test op
      - cannot add a nested key

  - id: core-code-retry-backoff
    title: Retry with exponential backoff
    suite: core
    archetype: code
    tier: H
    language: python
    held_out: false
    goal: |
      Implement retry(fn, attempts, base, sleep) in solution.py: call fn until
      it succeeds, sleeping base, 2*base, 4*base ... between attempts via the
      injected sleep(seconds); return the result; after attempts failures
      re-raise the last error.
    criteria:
      - pure stdlib
      - sleep is injected (deterministic)
      - re-raises the last error
    test_command: |
      python -c 'import solution
      calls = []
      sleeps = []
      def sleep(s):
          sleeps.append(s)
      def fn():
          calls.append(1)
          if len(calls) < 3:
              raise ValueError("x")
          return "ok"
      assert solution.retry(fn, 3, 1, sleep) == "ok"
      assert sleeps == [1, 2]
      calls.clear()
      sleeps.clear()
      def bad():
          calls.append(1)
          raise ValueError("no")
      try:
          solution.retry(bad, 3, 1, sleep)
          assert False, "exhausted retry did not raise"
      except ValueError as e:
          assert str(e) == "no"'
    acceptance_floor: test_command exits 0
    quality_rubric:
      - '5: correct exponential schedule, injected sleep, last error'
      - '3: correct but sleeps after the final attempt'
      - '1: swallows the error or uses time.sleep'
    expected_failure_modes:
      - sleeps after the last attempt
      - catches and returns None
      - uses a real time.sleep

  - id: core-code-weighted-intervals
    title: Weighted interval scheduling
    suite: core
    archetype: code
    tier: H
    language: python
    held_out: false
    goal: |
      Implement max_weight(intervals) in solution.py: each interval is (start,
      end, weight) with start < end; choose non-overlapping intervals
      (end <= next start) to maximise total weight and return that weight.
    criteria:
      - pure stdlib
      - end == start is compatible
      - empty input returns 0
    test_command: |
      python -c 'import solution
      iv = [(1,3,5), (2,5,6), (4,6,5), (6,7,4)]
      assert solution.max_weight(iv) == 14
      assert solution.max_weight([]) == 0
      assert solution.max_weight([(1,2,3)]) == 3'
    acceptance_floor: test_command exits 0
    quality_rubric:
      - '5: correct DP'
      - '3: correct but greedy (fails the sample)'
      - '1: sums overlapping weights'
    expected_failure_modes:
      - greedy by weight or end time
      - does not sort by end

