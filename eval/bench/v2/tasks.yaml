    '
  criteria:
  - pure stdlib
  - every node appears once
  - cycle raises ValueError
  test_command: |
    python -c 'import solution
    g = {"a": [], "b": ["a"], "c": ["b"]}
    o = solution.topo_sort(g)
    assert set(o) == set(g)
    assert o.index("a") < o.index("b") < o.index("c")
    try:
        solution.topo_sort({"a": ["b"], "b": ["a"]})
        assert False, "cycle not detected"
    except ValueError:
        pass'
  acceptance_floor: test_command exits 0
  quality_rubric:
  - '5: correct Kahn/DFS with cycle detection'
  - '3: correct order but no cycle detection'
  - '1: drops nodes'
  context_size: small
  context_demand: short
  expected_failure_modes:
  - silently returns a partial order on a cycle
  - treats dependencies as dependents
