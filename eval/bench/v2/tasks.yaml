- id: x-code-sqlite-migration
  title: Transactional SQLite migration runner
  archetype: code
  tier: X
  language: python
  held_out: false
  goal: 'Implement migrator.py with Migration(version, up, down), apply(db_path, migrations,
    target=None), rollback(db_path, migrations, target), and MigrationError. Track
    schema_migrations(version, checksum); apply in version order inside transactions;
    re-applying is a no-op; a checksum mismatch raises MigrationError.

    '
  criteria:
  - pure stdlib
  - transactional apply/rollback
  - idempotent re-apply
  - checksum mismatch is loud
  test_command: |
    python -c 'import sqlite3, tempfile, os
    from migrator import Migration, apply, rollback, MigrationError
    path = tempfile.mktemp()
    ms = [Migration(1, ["CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT)"], ["DROP TABLE t"]),
          Migration(2, ["ALTER TABLE t ADD COLUMN age INTEGER"], ["ALTER TABLE t DROP COLUMN age"])]
    apply(path, ms)
    con = sqlite3.connect(path)
    cols = {r[1] for r in con.execute("PRAGMA table_info(t)")}
    assert {"id", "name", "age"} <= cols
    con.execute("INSERT INTO t (id, name, age) VALUES (1, \"a\", 2)")
    con.commit()
    con.close()
    apply(path, ms)
    rollback(path, ms, 1)
    con = sqlite3.connect(path)
    cols = {r[1] for r in con.execute("PRAGMA table_info(t)")}
    assert "age" not in cols
    assert con.execute("SELECT name FROM t").fetchone()[0] == "a"
    con.close()
    bad = [Migration(1, ["CREATE TABLE t (id INTEGER)"], ["DROP TABLE t"])]
    try:
        apply(path, bad)
        assert False, "checksum mismatch accepted"
    except MigrationError:
        pass
    os.unlink(path)'
  acceptance_floor: test_command exits 0
  quality_rubric:
  - '5: correct transactions, checksum, rollback, and idempotence'
  - '3: applies but rollback or checksum is weak'
  - '1: non-transactional or leaves a partial schema'
  context_size: medium
  context_demand: short
  expected_failure_modes:
  - no transaction around a migration
  - checksum ignored
  - rollback drops data or the wrong version
