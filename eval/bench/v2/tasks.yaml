#
# The v1 pilot is archived at eval/bench/ (ADR-0075); this is a NEW version,
# not an edit. It removes every E and M task, keeps the v1 H floor, and adds
# repo-scale/multi-file X tasks above it. Generated H block + x-tasks.yaml.
---
version: 2
tasks:
- id: code-bank-atomic
  title: Bank accounts with atomic transfers and a ledger
  archetype: code
  tier: H
  context_demand: short
  language: python
  goal: Implement solution.py with `class Account(ledger=None)` exposing `balance`,
    `deposit(n)`, `withdraw(n)`, and `transfer(other, n)`, and `class Ledger` exposing
    an `entries` list. Overdraft must raise and leave the balance unchanged; a transfer
    that cannot complete must leave both balances unchanged; the ledger records one
    entry per successful operation.
  criteria:
  - pure stdlib
  - deposit/withdraw/transfer update balances correctly
  - overdraft raises and leaves the balance unchanged
  - a failed transfer is atomic (both balances unchanged)
  - the ledger records one entry per successful operation
  test_command: |
    python -c 'import solution
    l=solution.Ledger()
    a=solution.Account(l); a.deposit(100)
    assert a.balance==100, a.balance
    b=solution.Account(l); a.transfer(b,30)
    assert a.balance==70 and b.balance==30, (a.balance,b.balance)
    assert len(l.entries)==2, l.entries
    before=a.balance
    ok=False
    try: a.withdraw(1000)
    except Exception: ok=True
    assert ok, "overdraft must raise"
    assert a.balance==before, "failed withdrawal changed the balance"
    ok=False
    try: a.transfer(b,1000)
    except Exception: ok=True
    assert ok, "over-limit transfer must raise"
    assert a.balance==before and b.balance==30, "failed transfer was not atomic"'
  acceptance_floor: test_command exits 0
  quality_rubric:
  - '5: all tests pass; errors typed; atomicity proven; ledger consistent'
  - '3: tests pass but error types are generic or the ledger misses a path'
  - '1: balances or atomicity wrong; tests fail'
  context_size: medium
  expected_failure_modes:
  - non-atomic transfer (partial mutation on failure)
  - float money instead of integer cents / Decimal
  - ledger records attempts, not successes
- id: code-expr-eval
  title: Arithmetic expression evaluator
  archetype: code
  tier: H
  context_demand: short
  language: python
  goal: Implement evaluate(expr) in solution.py for integer arithmetic with + - *
    /, parentheses, unary minus, and correct precedence; division by zero raises ZeroDivisionError
    and malformed input raises ValueError.
  criteria:
  - pure stdlib
  - precedence and associativity correct for * / over + -
  - parentheses and nested parentheses handled
  - unary minus handled at start and after operators
  - division by zero raises ZeroDivisionError
  - malformed input raises ValueError
  test_command: |
    python -c 'import solution
    assert solution.evaluate("2+3*4")==14
    assert solution.evaluate("(2+3)*4")==20
    assert solution.evaluate("-3+5")==2
    assert solution.evaluate("10-2-3")==5
    assert solution.evaluate("2*-3")==-6
    assert solution.evaluate("2*(3+4)-5")==9
    ok=False
    try: solution.evaluate("1/0")
    except ZeroDivisionError: ok=True
    assert ok, "division by zero must raise ZeroDivisionError"
    ok=False
    try: solution.evaluate("2+")
    except ValueError: ok=True
    assert ok, "malformed input must raise ValueError"'
  acceptance_floor: test_command exits 0
  quality_rubric:
  - '5: all pass; parser is not eval(); errors typed and distinct'
  - '3: all pass but uses eval() or collapses error cases'
  - '1: precedence wrong or errors swallowed'
  context_size: small
  expected_failure_modes:
  - left-to-right evaluation ignoring precedence
  - using eval() and catching everything
  - unary minus mis-parsed after '(' or an operator
- id: code-lru-ttl
  title: LRU cache with TTL
  archetype: code
  tier: H
  context_demand: short
  language: python
  goal: Implement LRUCache(capacity, ttl_seconds) in solution.py with get/put, LRU
    eviction at capacity (an update refreshes recency), and expiry by TTL; get on
    an expired key misses.
  criteria:
  - pure stdlib
  - eviction is LRU, including on update of an existing key
  - expired entries miss even when under capacity
  - capacity 1 evicts correctly
  test_command: |
    python -c 'import solution,time
    c=solution.LRUCache(2,0.05)
    c.put("a",1); c.put("b",2)
    assert c.get("a")==1
    c.put("c",3)
    assert c.get("b") is None, "b should be evicted as LRU"
    assert c.get("a")==1 and c.get("c")==3
    time.sleep(0.08)
    assert c.get("a") is None, "a should have expired"
    d=solution.LRUCache(1,10)
    d.put("x",1); d.put("y",2)
    assert d.get("x") is None and d.get("y")==2'
  acceptance_floor: test_command exits 0
  quality_rubric:
  - '5: all pass; true O(1) with an ordered map; expiry consistent'
  - '3: all pass but update does not refresh recency'
  - '1: expiry or eviction wrong'
  context_size: small
  expected_failure_modes:
  - dict insertion order mistaken for LRU (update does not move to front)
  - expiry only checked at eviction
  - O(n) eviction scan
- id: code-unified-diff
  title: Unified diff with exact output
  archetype: code
  tier: H
  context_demand: short
  language: python
  goal: Implement unified_diff(a, b) in solution.py returning the same lines as difflib.unified_diff(a,
    b) (lists of lines), including correct @@ hunk headers and 3 lines of context.
  criteria:
  - pure stdlib
  - hunk headers have correct start/length
  - 3 lines of context on each side
  - identical inputs produce an empty diff
  test_command: |
    python -c 'import solution,difflib
    a="a\nb\nc\nd\ne\nf\ng\nh\n".splitlines(True)
    b="a\nB\nc\nd\ne\nf\ng\nh\n".splitlines(True)
    assert list(solution.unified_diff(a,b))==list(difflib.unified_diff(a,b))
    assert list(solution.unified_diff(a,a))==[]
    c="1\n2\n3\n4\n5\n".splitlines(True)
    d="1\n2\nX\n4\n5\n".splitlines(True)
    assert list(solution.unified_diff(c,d))==list(difflib.unified_diff(c,d))'
  acceptance_floor: test_command exits 0
  quality_rubric:
  - '5: byte-exact on all cases; hunk math correct'
  - '3: correct hunks but off-by-one context or header counts'
  - '1: reimplements incorrectly or shells out'
  context_size: small
  expected_failure_modes:
  - off-by-one in hunk start/length
  - no context lines
  - non-deterministic ordering
