# Athanor benchmark v2 — the X (extreme) tasks.
#
# These are merged into tasks.yaml after the v1 H floor. They are repo-scale,
# multi-file, long-context, or adversarial, and every one is harder than the v1
# H tasks. The v2 test validates the merged corpus and executes every code
# reference.
version: 2
tasks:

  - id: x-code-repo-ratelimit
    title: Multi-key token bucket in a provided package
    archetype: code
    tier: X
    language: python
    fixture: eval/bench/v2/fixtures/x-code-repo-ratelimit
    repo: eval/bench/v2/fixtures/x-code-repo-ratelimit
    held_out: false
    goal: |
      The provided ratelimit package has a stubbed Limiter in ratelimit/bucket.py. Implement it without changing the public API or MemoryStore: per-key token bucket, rate/capacity, injected clock, store persistence, and allow(key, n=1). Emit the full changed files as === FILE: path === blocks.
    criteria:
      - "pure stdlib"
      - "per-key independent buckets"
      - "fractional refill capped at capacity"
      - "state persists through the store"
      - "n > capacity is refused"
    test_command: |
      python -c 'from ratelimit import Limiter, MemoryStore
      class C:
          def __init__(self):
              self.t = 0
          def __call__(self):
              return self.t
      c = C()
      s = MemoryStore()
      l = Limiter(1, 2, s, c)
      assert l.allow("a") and l.allow("a") and not l.allow("a")
      assert l.allow("b")
      c.t = 1
      assert l.allow("a")
      assert not l.allow("a")
      c.t = 2
      l2 = Limiter(1, 2, s, c)
      assert l2.allow("b")
      c.t = 3
      d = Limiter(0.5, 1, s, c)
      assert d.allow("z")
      assert not d.allow("z")
      c.t = 5
      assert d.allow("z")
      assert not l2.allow("a", 3)'
    acceptance_floor: "test_command exits 0"
    quality_rubric:
      - "5: correct across keys, persistence, fractional refill, and the capacity edge"
      - "3: correct basic bucket but persistence or fractional refill wrong"
      - "1: shared state between keys or ignores the clock"
    context_size: medium
    context_demand: repo
    expected_failure_modes:
      - "one global bucket instead of per-key"
      - "refills on every call instead of by elapsed time"
      - "does not persist state through the store"

  - id: x-code-bugfix-pipeline
    title: Fix three bugs in a provided pipeline
    archetype: code
    tier: X
    language: python
    fixture: eval/bench/v2/fixtures/x-code-bugfix-pipeline
    repo: eval/bench/v2/fixtures/x-code-bugfix-pipeline
    held_out: true
    goal: |
      The provided pipeline package contains three bugs. Fix them without changing the public API: parse_csv must handle quoted commas; total_by_category must return integer totals; top_categories must order by total descending and then by name. Emit the full changed files as === FILE: path === blocks.
    criteria:
      - "pure stdlib"
      - "quoted CSV fields parse"
      - "totals are integers"
      - "ordering is value-descending then name"
    test_command: |
      python -c 'from pipeline import parse_csv, total_by_category, top_categories
      rows = parse_csv("name,amount,category\n\"Ada, Jr.\",10,a\nSam,5,b\nAda,2,a\n")
      assert rows[0]["name"] == "Ada, Jr.", rows
      assert total_by_category(rows) == {"a": 12, "b": 5}, total_by_category(rows)
      assert top_categories({"b": 10, "a": 5}, 1) == ["b"]
      assert top_categories({"b": 10, "a": 5}, 2) == ["b", "a"]'
    acceptance_floor: "test_command exits 0"
    quality_rubric:
      - "5: all three fixed, API unchanged"
      - "3: two fixed and one padded"
      - "1: rewrites the API or misses a bug"
    context_size: medium
    context_demand: repo
    expected_failure_modes:
      - "splitting on commas instead of using a CSV parser"
      - "string totals or a TypeError"
      - "sorting by name instead of total"

  - id: x-code-interpreter
    title: Small expression-language interpreter
    archetype: code
    tier: X
    language: python
    held_out: true
    goal: |
      Create the exprlang package with evaluate(source) for integer arithmetic and let bindings: statements separated by semicolons, identifiers, + - * /, parentheses, and unary minus. Malformed input, undefined variables, and division by zero raise ExprError. evaluate returns the last statement's value.
    criteria:
      - "pure stdlib"
      - "precedence and parentheses"
      - "let bindings and sequential statements"
      - "typed ExprError on bad input"
    test_command: |
      python -c 'from exprlang import evaluate, ExprError
      assert evaluate("2+3*4") == 14
      assert evaluate("let x = 2; x * (3 + 4)") == 14
      assert evaluate("let x = 1; let y = x+1; y*3") == 6
      assert evaluate("-2*3") == -6
      try:
          evaluate("1/0")
          assert False, "division by zero accepted"
      except ExprError:
          pass
      try:
          evaluate("x+1")
          assert False, "undefined variable accepted"
      except ExprError:
          pass
      try:
          evaluate("2+")
          assert False, "malformed input accepted"
      except ExprError:
          pass'
    acceptance_floor: "test_command exits 0"
    quality_rubric:
      - "5: clean lexer/parser/eval with typed errors"
      - "3: correct arithmetic but weak error typing"
      - "1: uses eval() or mis-parses precedence"
    context_size: medium
    context_demand: short
    expected_failure_modes:
      - "left-to-right evaluation ignoring precedence"
      - "one-line eval() with swallowed errors"
      - "let bindings are not scoped to later statements"

  - id: x-code-diff3
    title: Three-way line merge
    archetype: code
    tier: X
    language: python
    held_out: false
    goal: |
      Implement merge3(base, ours, theirs) in merge3.py for equal-length line lists. Merge non-overlapping changes; when both sides change the same line differently, emit a conflict block and record the index. Return (merged, conflicts); unequal lengths raise ValueError.
    criteria:
      - "pure stdlib"
      - "non-overlapping changes merge"
      - "conflicts are marked and indexed"
      - "unequal lengths raise ValueError"
    test_command: |
      python -c 'from merge3 import merge3
      b = ["a\n", "b\n", "c\n"]
      o = ["a\n", "B\n", "c\n"]
      t = ["a\n", "b\n", "C\n"]
      m, c = merge3(b, o, t)
      assert m == ["a\n", "B\n", "C\n"] and c == []
      m, c = merge3(b, o, o)
      assert m == o and c == []
      m, c = merge3(b, o, ["a\n", "X\n", "c\n"])
      assert c == [1] and any("<<<<<<<" in x for x in m)
      try:
          merge3(b, o, [])
          assert False, "unequal lengths accepted"
      except ValueError:
          pass'
    acceptance_floor: "test_command exits 0"
    quality_rubric:
      - "5: correct merge/conflict logic and exact markers"
      - "3: merges but the conflict index or marker is wrong"
      - "1: overwrites one side or ignores conflicts"
    context_size: small
    context_demand: short
    expected_failure_modes:
      - "always takes ours"
      - "no conflict markers"
      - "crashes on unequal lengths instead of ValueError"

  - id: x-code-threadpool
    title: Bounded thread pool with futures
    archetype: code
    tier: X
    language: python
    held_out: false
    goal: |
      Implement ThreadPool(workers) in threadpool.py with submit(fn, *args) returning a Future with result(timeout=None), done(), and cancel(); shutdown(wait=True); exceptions propagate through result(); submitting after shutdown raises RuntimeError.
    criteria:
      - "pure stdlib"
      - "bounded by workers"
      - "exceptions propagate"
      - "shutdown is enforced"
    test_command: |
      python -c 'from threadpool import ThreadPool
      p = ThreadPool(2)
      fs = [p.submit(lambda x: x * x, i) for i in range(5)]
      assert [f.result(5) for f in fs] == [0, 1, 4, 9, 16]
      p.shutdown()
      try:
          p.submit(lambda: 1)
          assert False, "submit after shutdown accepted"
      except RuntimeError:
          pass
      p2 = ThreadPool(1)
      f = p2.submit(lambda: 1/0)
      try:
          f.result()
          assert False, "exception swallowed"
      except ZeroDivisionError:
          pass
      p2.shutdown()'
    acceptance_floor: "test_command exits 0"
    quality_rubric:
      - "5: correct future semantics, exceptions, and shutdown"
      - "3: works but shutdown is not enforced"
      - "1: unbounded or swallows exceptions"
    context_size: small
    context_demand: short
    expected_failure_modes:
      - "no bound on workers"
      - "exceptions disappear in the worker thread"
      - "accepts work after shutdown"

  - id: x-code-sqlite-migration
    title: Transactional SQLite migration runner
    archetype: code
    tier: X
    language: python
    held_out: false
    goal: |
      Implement migrator.py with Migration(version, up, down), apply(db_path, migrations, target=None), rollback(db_path, migrations, target), and MigrationError. Track schema_migrations(version, checksum); apply in version order inside transactions; re-applying is a no-op; a checksum mismatch raises MigrationError.
    criteria:
      - "pure stdlib"
      - "transactional apply/rollback"
      - "idempotent re-apply"
      - "checksum mismatch is loud"
    test_command: |
      python -c 'import sqlite3, tempfile, os
      from migrator import Migration, apply, rollback, MigrationError
      path = tempfile.mktemp()
      ms = [Migration(1, ["CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT)"], ["DROP TABLE t"]),
            Migration(2, ["ALTER TABLE t ADD COLUMN age INTEGER"], ["ALTER TABLE t DROP COLUMN age"])]
      apply(path, ms)
      con = sqlite3.connect(path)
      cols = {r[1] for r in con.execute("PRAGMA table_info(t)")}
      assert {"id", "name", "age"} <= cols
      con.execute("INSERT INTO t (id, name, age) VALUES (1, \"a\", 2)")
      con.commit()
      con.close()
      apply(path, ms)
      rollback(path, ms, 1)
      con = sqlite3.connect(path)
      cols = {r[1] for r in con.execute("PRAGMA table_info(t)")}
      assert "age" not in cols
      assert con.execute("SELECT name FROM t").fetchone()[0] == "a"
      con.close()
      bad = [Migration(1, ["CREATE TABLE t (id INTEGER)"], ["DROP TABLE t"])]
      try:
          apply(path, bad)
          assert False, "checksum mismatch accepted"
      except MigrationError:
          pass
      os.unlink(path)'
    acceptance_floor: "test_command exits 0"
    quality_rubric:
      - "5: correct transactions, checksum, rollback, and idempotence"
      - "3: applies but rollback or checksum is weak"
      - "1: non-transactional or leaves a partial schema"
    context_size: medium
    context_demand: short
    expected_failure_modes:
      - "no transaction around a migration"
      - "checksum ignored"
      - "rollback drops data or the wrong version"

  - id: x-doc-spec-from-code
    title: Specification from a provided module
    archetype: document
    tier: X
    fixture: eval/bench/v2/fixtures/x-doc-spec-from-code
    held_out: false
    goal: |
      Write a specification for the provided quota module with exactly the sections API, Behavior, Errors, and Compatibility, in that order. List every public class and method with its real signature, describe the error type, and introduce no API that is not in the source.
    criteria:
      - "sections API, Behavior, Errors, Compatibility in order"
      - "every public symbol and signature"
      - "the exact error type"
      - "no invented API"
    checks:
      required_sections: [API, Behavior, Errors, Compatibility]
      strict_section_order: [API, Behavior, Errors, Compatibility]
      must_contain: ["Quota", "QuotaError", "spend", "refund", "remaining"]
      max_words: 500
    acceptance_floor: "sections in order, every public symbol named, no invented API"
    quality_rubric:
      - "5: accurate, complete, and no fabrication"
      - "3: sections present but a signature or error is vague"
      - "1: invents methods or omits the error type"
    context_size: medium
    context_demand: repo
    expected_failure_modes:
      - "inventing a reset or limit method"
      - "missing the QuotaError subclass"
      - "describing behavior not in the source"

