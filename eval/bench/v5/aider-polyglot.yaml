# v5 external validation track — Aider Polyglot / Exercism Python subset.
#
# This is NOT the official Aider leaderboard harness. It is a custom Athanor
# adapter that runs the official Exercism exercises and re-runs their tests in
# a fresh, network-none container after Athanor exits. The label is external to
# Athanor's verifier.
#
# The track is versioned independently of the frozen claim corpus. Updating the
# adapter, the exercise list, or the source commit does not edit the claim
# suites; the report always names the track version. Never use this track to
# tune the frozen claim tasks.
version: 1
track: aider-polyglot
adapter: athanor-custom
source: https://github.com/exercism/python
source_commit: 479f11b44b02337b0413e805b948491c2179615a
language: python
test_command: python -m pytest -q
# Eight single-file exercises, chosen for a cheap, deterministic grounded
# signal. The wider Aider Polyglot set is 225 exercises across six languages.
exercises:
  - two-fer
  - leap
  - pangram
  - isogram
  - raindrops
  - rna-transcription
  - acronym
  - hamming
note: >
  Custom adapter over the official Exercism tests; not a leaderboard entry.
  A score is comparable across Athanor versions using the same track version,
  and to the community only as "Exercism Python tests," not as an Aider
  leaderboard rank.
