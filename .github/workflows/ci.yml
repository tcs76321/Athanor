# CI for the Athanor daemon (ROADMAP M0-T8).
# CGO is required: internal/store uses mattn/go-sqlite3 (ADR 0003),
# so every job sets CGO_ENABLED=1 via the Makefile.
#
# Action versions: golangci-lint-action v7 is required for golangci-lint
# v2 configs (v6 rejects v2 version strings); checkout@v5 / setup-go@v6
# / golangci-lint-action@v7 run on Node.js 24, avoiding the Node 20
# deprecation.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Vet
        run: make vet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Test (race detector)
        run: make test-race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=5m --build-tags sqlite_fts5

  # Vulnerability scan (F3-T1). govulncheck is not part of `make check`
  # (it downloads the vuln DB and is slow), so it is its own job.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Vulnerability scan
        run: make vuln

  # Module-file hygiene (F3-T1): fail if `go mod tidy` would change
  # go.mod/go.sum, so an untidy require set cannot land.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Check go.mod/go.sum are tidy
        run: make tidy-check

  # Per-package coverage floor for the security-critical packages (F5).
  # `make cover` reports a whole-tree number that can hide a regression in one
  # weakly-covered package; this job pins conservative per-package floors.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Coverage floor
        run: make cover-check

  # Behavioral integration probes (M2 hardening, M2-T4b exec, M4 gateway).
  # These bring up real rootless Podman pods and, for the gateway probes,
  # reach the real internet, so they are deliberately NOT part of `make
  # check`. They run here on every push and PR.
  #
  # The job is REQUIRED (F3-T7): it carries no continue-on-error, so the
  # behavioral probes gate merges and a regression in pod hardening, exec,
  # or the gateway cannot land. (It was non-blocking while the runner's
  # rootless-Podman setup was being proven; that period is over.)
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Install podman (if absent)
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - name: Verify podman
        run: podman --version
      - name: Pull probe images
        run: make integration-images
      - name: Run integration probes
        run: make test-integration
